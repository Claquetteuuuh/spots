services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trs
      POSTGRES_PASSWORD: trs_local_pwd
      POSTGRES_DB: the_right_spot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trs -d the_right_spot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
