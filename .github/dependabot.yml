version: 2
updates:
  # ── pnpm (root monorepo) ────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # Group minor+patch to avoid PR spam.
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Ignore Expo-managed packages — they must stay in sync with the SDK.
    ignore:
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"

  # ── Web app ─────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - web
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # ── Mobile app ──────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - mobile
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"

  # ── GitHub Actions ──────────────────────────────────────────────────
  # Auto-update action SHAs for security patches.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
