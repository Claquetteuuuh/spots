# ──────────────────────────────────────────────────────────────────────
# Dependabot — one pull request per ecosystem, per week.
#
# Groups matter twice over: without them each bump is its own PR, and
# each PR fires the whole CI fleet. `applies-to: security-updates` is the
# one that bites — security bumps ignore version-update groups unless it
# is spelled out, which is how eight separate PRs land in one morning.
# ──────────────────────────────────────────────────────────────────────
version: 2
updates:
  # ── pnpm (root monorepo) ────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      all-updates:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # Ignore Expo-managed packages — they must stay in sync with the SDK.
    ignore:
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"

  # ── Web app ─────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - web
    groups:
      all-updates:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # ── Mobile app ──────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - mobile
    groups:
      all-updates:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"

  # ── GitHub Actions ──────────────────────────────────────────────────
  # Auto-update action SHAs for security patches.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
