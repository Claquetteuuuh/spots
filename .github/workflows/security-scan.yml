# ──────────────────────────────────────────────────────────────────────
# Grype SCA — Software Composition Analysis
# Scans dependencies for known CVEs. Fails on High/Critical.
# Results uploaded to GitHub Security → Code scanning tab.
# ──────────────────────────────────────────────────────────────────────
name: "🔒 Grype SCA"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 6 AM UTC — catch new CVEs in existing deps.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write  # SARIF upload to Security tab

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sca:
    name: Grype dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Grype SCA scan
        uses: anchore/scan-action@2c901ab7378897c01b8efaa2d0c9bf519cc64b9e # v6.2.0
        id: grype
        with:
          path: "."
          fail-build: true
          severity-cutoff: high
          output-format: sarif

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-sca
