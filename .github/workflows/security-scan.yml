# ──────────────────────────────────────────────────────────────────────
# Grype SCA — Software Composition Analysis
# Scans dependencies for known CVEs. Fails on High/Critical.
# Results uploaded to GitHub Security → Code scanning tab.
# ──────────────────────────────────────────────────────────────────────
name: "🔒 Grype SCA"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 6 AM UTC — catch new CVEs in existing deps.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write  # SARIF upload to Security tab

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sca:
    name: Grype dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Grype SCA scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2 (grype 0.118)
        id: grype
        with:
          path: "."
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          cache-db: true

      # SARIF is unreadable in the job log — print what tripped the gate so the
      # failure is actionable without downloading artifacts.
      - name: Show findings
        if: failure() && steps.grype.outputs.sarif != ''
        env:
          SARIF: ${{ steps.grype.outputs.sarif }}
        run: |
          jq -r '.runs[0].results[] | "\(.level)\t\(.ruleId)\t\(.message.text)"' "$SARIF" || cat "$SARIF"

      # The scan step above is the gate. The upload is best-effort: Code scanning is
      # only available on public repos (or with Code Security), so it must never
      # turn a clean scan into a red check.
      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-sca
