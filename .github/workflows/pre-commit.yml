# ──────────────────────────────────────────────────────────────────────
# Pre-commit — the hygiene hooks from .pre-commit-config.yaml
# Formatting, secrets detection, YAML/Markdown/Actions linting: what a
# developer skipping the local hook would let through.
#
# The heavy hooks (tests, typecheck, the Expo SDK check) are skipped
# here on purpose — CI runs all three, and running them twice on every
# push is the single biggest waste of minutes in this repo.
# ──────────────────────────────────────────────────────────────────────
name: "✅ Pre-commit"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Owned by CI (its lint-typecheck, test and build jobs)
  SKIP: test-suite,typecheck,expo-native-deps

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No workspace install: every hook left after SKIP brings its own
      # environment (python, go, or pre-commit's own node). Put the pnpm
      # setup back if one of the skipped hooks is ever re-enabled here.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
