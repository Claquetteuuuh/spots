# ──────────────────────────────────────────────────────────────────────
# CodeQL — GitHub's native SAST engine
# Deep semantic analysis of JavaScript/TypeScript code.
# Complements Bearer with dataflow-aware taint tracking.
# Results appear in GitHub Security → Code scanning tab.
# ──────────────────────────────────────────────────────────────────────
name: "🧬 CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Wednesday 4 AM UTC.
    - cron: "0 4 * * 3"

permissions:
  contents: read
  security-events: write  # Required for CodeQL results

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CodeQL's only output is an upload to Code scanning, which GitHub enables on
    # public repos (or with Code Security on paid plans). On a private repo the
    # analysis fails at upload time, so skip it until then — drop this guard once
    # Code scanning is enabled in Settings → Security.
    # …and a dependency bump changes no source to analyse.
    if: ${{ !github.event.repository.private && github.actor != 'dependabot[bot]' }}
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          # Extended queries catch more issues (quality + security).
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
