# ──────────────────────────────────────────────────────────────────────
# CodeQL — GitHub's native SAST engine
# Deep semantic analysis of JavaScript/TypeScript code.
# Complements Bearer with dataflow-aware taint tracking.
# Results appear in GitHub Security → Code scanning tab.
# ──────────────────────────────────────────────────────────────────────
name: "🧬 CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Wednesday 4 AM UTC.
    - cron: "0 4 * * 3"

permissions:
  contents: read
  security-events: write  # Required for CodeQL results

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          languages: ${{ matrix.language }}
          # Extended queries catch more issues (quality + security).
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          category: "/language:${{ matrix.language }}"
