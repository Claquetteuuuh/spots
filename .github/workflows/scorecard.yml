# ──────────────────────────────────────────────────────────────────────
# OSSF Scorecard — Supply chain security assessment
# Inspired by CISO Assistant (intuitem). Evaluates the repo's security
# posture: branch protection, dependency pinning, CI hardening, etc.
# Results appear in GitHub Security → Code scanning tab.
# ──────────────────────────────────────────────────────────────────────
name: "🏆 OSSF Scorecard"

on:
  push:
    branches: [main]
  schedule:
    # Weekly Tuesday 5 AM UTC.
    - cron: "0 5 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scorecard can only publish results (and Code scanning only accepts SARIF)
    # for public repos. Runs automatically the day the repo goes public.
    if: ${{ !github.event.repository.private }}
    permissions:
      # Job-level permissions REPLACE the top-level set, so `contents: read` must be
      # repeated here — without it the token cannot even fetch a private repo (git exit 128).
      contents: read
      security-events: write  # SARIF upload
      id-token: write         # OIDC token for Scorecard API

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: scorecard-results.sarif
          category: ossf-scorecard
