# ──────────────────────────────────────────────────────────────────────
# Dependency Review — PR gate for new vulnerabilities
# Blocks PRs that introduce dependencies with known High/Critical CVEs.
# Only runs on pull requests (compares base → head).
# ──────────────────────────────────────────────────────────────────────
name: "📦 Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write  # Required for inline comments

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Deny copyleft licenses that would force open-sourcing.
          deny-licenses: AGPL-3.0-only, GPL-3.0-only, GPL-2.0-only
          comment-summary-in-pr: always
