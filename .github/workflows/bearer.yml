# ──────────────────────────────────────────────────────────────────────
# Bearer SAST — Static Application Security Testing + PII detection
# Scans source code for security issues. Fails on Critical/High.
# Results uploaded to GitHub Security → Code scanning tab.
# ──────────────────────────────────────────────────────────────────────
name: "🛡️ Bearer SAST"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 6:30 AM UTC — catch new rules.
    - cron: "30 6 * * 1"

permissions:
  contents: read
  security-events: write  # SARIF upload to Security tab

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: Bearer scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A dependency bump changes no source: Grype and Dependency Review are
    # the ones with something to say about it, and they still run.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Bearer SAST scan
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        id: bearer
        with:
          severity: critical,high
          format: sarif
          output: bearer-results.sarif

      # The scan step above is the gate. The upload is best-effort: Code scanning is
      # only available on public repos (or with Code Security), so it must never
      # turn a clean scan into a red check.
      - name: Upload SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: bearer-results.sarif
          category: bearer-sast
