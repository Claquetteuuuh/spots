# ──────────────────────────────────────────────────────────────────────
# CI — Lint · Typecheck · Test · Build
# Runs on every push and PR. Tests require a PostgreSQL service.
# ──────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel stale runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ────────────────────────────────────────────────────────────────────
  lint-typecheck:
    name: "🔍 Lint & Typecheck"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fe02b34f77f8bc703571ae22b7da3e01f1a398e6 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ────────────────────────────────────────────────────────────────────
  test:
    name: "🧪 Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-typecheck]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trs
          POSTGRES_PASSWORD: trs_local_pwd
          POSTGRES_DB: the_right_spot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fe02b34f77f8bc703571ae22b7da3e01f1a398e6 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Run tests with coverage
        run: pnpm test:ci
        env:
          DATABASE_URL: postgresql://trs:trs_local_pwd@localhost:5432/the_right_spot_test
          JWT_SECRET: test-secret-ci
          JWT_REFRESH_SECRET: test-refresh-secret-ci

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports
          path: |
            apps/web/coverage/
            apps/mobile/coverage/
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────
  build:
    name: "🏗️ Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fe02b34f77f8bc703571ae22b7da3e01f1a398e6 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Build all apps
        run: pnpm build
        env:
          DATABASE_URL: postgresql://trs:x@localhost:5432/unused
          JWT_SECRET: build-secret
          JWT_REFRESH_SECRET: build-refresh-secret
