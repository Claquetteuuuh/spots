# ──────────────────────────────────────────────────────────────────────
# CI Hardening — zizmor GitHub Actions security linter
# Inspired by CISO Assistant (intuitem/ciso-assistant-community).
# Scans workflow files for template injection, insecure patterns,
# unpinned actions, and other CI/CD security issues.
# ──────────────────────────────────────────────────────────────────────
name: "🔧 CI Hardening"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pipx install zizmor==1.6.0

      - name: Audit GitHub Actions workflows
        run: zizmor --format sarif . > zizmor-results.sarif
        # Don't fail on warnings — only errors are blocking.
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor-ci-hardening
